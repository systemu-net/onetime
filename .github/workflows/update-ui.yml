name: update-ui

on:
  push:
    branches:
      - develop

permissions:
  actions: write
  contents: read
  pull-requests: write
env:
  HUSKY: 0

jobs:
  update-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          persist-credentials: false
          path: ./ui
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.17.0"
      - name: Install dependencies
        run: npm ci
      - name: Lint UI
        run: npm run lint src/**/*.{ts,tsx,js}
      - name: Build UI
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - id: create_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_POLICE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_POLICE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout API code
        uses: actions/checkout@v2
        with:
          persist-credentials: false
          path: ./api
          ref: develop
          repository: "systemu-net/thin.ly"
          token: ${{ steps.create_token.outputs.token }}
      - name: Sync built UI into API (shells + assets)
        # `npm run sync:thinly` writes ui.html AND ui_levelcode.html.erb (with <%= csrf_meta_tags %>
        # + window.__ENV__.BRAND) plus the hashed bundles — the same logic devs run locally. Assets
        # go to the git-tracked app/assets/interface (nginx-aliased, committed in the PR below), not
        # the local-dev public/assets default.
        run: npm run sync:thinly
        env:
          THINLY_DIR: ${{ github.workspace }}/api
          THINLY_ASSETS_DIR: app/assets/interface
      - name: Create PR
        uses: googleapis/code-suggester@v2
        with:
          command: pr
          upstream_repo: "thin.ly"
          upstream_owner: ${{ github.repository_owner }}
          description: Auto update UI from onetime repo
          title: "feat: Auto update UI from onetime repo"
          message: "feat: Auto update UI from onetime repo"
          branch: "auto-update/update-ui"
          primary: develop
          force: true
          fork: false
          labels: automated
          git_dir: api
        env:
          ACCESS_TOKEN: ${{ steps.create_token.outputs.token }}
